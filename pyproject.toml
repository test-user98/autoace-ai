[project]
name = "voicetrial"
version = "0.1.0"
description = "Emotional tone and background noise analysis for production call audio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyannote-audio>=3.3",
    "pydantic>=2.9",
    "scikit-learn>=1.9.0",
    "torch>=2.4",
    "torchaudio>=2.4",
]

[project.optional-dependencies]
dsp = [
    "scipy>=1.14",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetrial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
